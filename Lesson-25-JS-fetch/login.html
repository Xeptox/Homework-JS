<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="login.js"></script>
</head>
<body>
<div>
    <label>First name:
        <input type="text" id="firstName" placeholder="John">
    </label>
    <label>Last name:
        <input type="text" id="lastName" placeholder="Smith">
    </label>
    <label>Login:
        <input type="text" id="login" placeholder="Login">
    </label>
    <label>Password:
        <input type="text" id="password" placeholder="Very strong password">
    </label>
    <button id="register">Register</button>
</div>
</body>
</html>
